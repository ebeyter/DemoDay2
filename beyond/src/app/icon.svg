<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Sekme ikonu. Başlıktaki işaretin DOLU varyantı: 16 pikselde ince mavi
    çizgiler hem açık hem koyu sekme çubuğunda kayboluyordu. Dolu zemin +
    beyaz işaret her yerde duruyor.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <path d="M 7.4 24.4 H 17.4" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.2"
        stroke-linecap="round" fill="none"/>
  <path d="M 8.4 24.4 Q 10.8 12.2 22 10" stroke="#FFFFFF" stroke-width="3.2"
        stroke-linecap="round" fill="none"/>
  <circle cx="22.3" cy="9.9" r="3.4" fill="#FFFFFF"/>
</svg>
