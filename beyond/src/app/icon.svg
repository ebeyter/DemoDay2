<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Sekme ikonu. Başlıktaki işaretin aynısı ama çizgiler daha kalın (1.3 -> 1.9)
    ve püskül yok: 16 pikselde ince çizgiler eriyip lekeye dönüşüyor, püskül de
    kepten ayırt edilemiyordu. Silueti koruyan en sade hal.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <g stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 16 7.4 L 24 11 L 16 14.6 L 8 11 Z" fill="#FFFFFF"/>
    <circle cx="16" cy="18.6" r="3.3"/>
    <path d="M 9.6 28.6 a 6.4 6.4 0 0 1 12.8 0"/>
  </g>
</svg>
